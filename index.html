            try { sensors.bp.characteristic.readValue().then(val => {
              if (val.byteLength >= 4) {
                const sis = val.getUint16(1, true);
                const dia = val.getUint16(3, true);
                if (sis != null && !isNaN(sis) && sis > 40 && sis < 300) { setPressaoSis(sis); setPressaoDia(dia); }
              }
            }).catch(e => console.warn('[Ciclo 3min] BLE BP read:', e.message)); } catch(e) {}
          }
          
          // Salvar registro periódico
          const registro = { data: new Date().toLocaleString('pt-BR'), fc: heartRate, pa: pressaoSis && pressaoDia ? pressaoSis+'/'+pressaoDia : '--', speed: speed || 0 };
          const hist = JSON.parse(localStorage.getItem('gv_ciclo_saude') || '[]');
          hist.push(registro);
          if (hist.length > 100) hist.shift();
          localStorage.setItem('gv_ciclo_saude', JSON.stringify(hist));
          console.log('[GuardiaVia] Ciclo 3min — registro salvo:', registro);
          
          // Enviar status pro Telegram (se ativo)
          if (telegramConfig.ativo) {
            sendTelegram('📊 *Status GuardiaVia*\n🕐 ' + registro.data + '\n💓 FC: ' + (heartRate != null && !isNaN(heartRate) ? heartRate : '--') + ' bpm\n🩺 PA: ' + registro.pa + ' mmHg\n🚗 Vel: ' + (speed != null && !isNaN(speed) ? speed : '--') + ' km/h\n📍 GPS: ' + userLat.toFixed(4) + ', ' + userLng.toFixed(4));
          }
          
          // Atualizar notificação do foreground service
          updateNotification(speed, heartRate, pressaoSis, pressaoDia);
        };
        
        const ciclo = setInterval(doReading, 180000); // 3 minutos
        return () => clearInterval(ciclo);
      }, [monitoring, heartRate, pressaoSis, pressaoDia, speed, telegramConfig]);

      // Envia alerta via Telegram com localização
      const sendEmergencyAlert = (tipo, detalhe) => {
        // Rate-limit check
        const now = Date.now();
        const lastTime = lastAlertTime.current[tipo] || 0;
        if (now - lastTime < 60000) {
          console.log('[GuardiaVia] Rate-limit: alerta "'+tipo+'" bloqueado (aguarde 60s)');
          return;
        }
        lastAlertTime.current[tipo] = now;
        
        // VIBRAÇÃO INTENSA (2 segundos) — celular + watch pareado
        vibrateAlert();
        
        const msg = '🚨 *EMERGÊNCIA GUARDIAVIA*\n\n' +
          '⚠️ Tipo: ' + tipo + '\n' +
          '📊 Detalhe: ' + detalhe + '\n' +
          '📍 Localização: https://www.google.com/maps?q=' + userLat + ',' + userLng + '\n\n' +
          'A pessoa NÃO respondeu ao alerta em tempo. Por favor verifique imediatamente!';
        
        // === ENVIO TELEGRAM (automático, instantâneo) ===
        sendTelegram(msg);
        
        if (!telegramConfig.ativo) {
          alert('🚨 ALERTA! ' + tipo + '\n' + detalhe + '\n\n⚠️ Configure o Telegram para envio automático de alertas!');
        }
      };

      // Simula detecção de colisão (quando velocidade > 70 e monitoramento ativo)
      const simulateCrash = () => {
        if (monitoring && speed > 70) {
          setCrashAlert(true);
          setCrashCountdown(15);
        }
      };

      const toggle = (id) => setProtections(p => p.map(x => x.id===id ? {...x, active:!x.active} : x));

      const getIcon = (id) => {
        if (id==='parada') return <IconAlertTriangle color="#ff5555" size={18}/>;
        if (id==='fc-alta') return <IconHeart color="#ff6eb4" size={18}/>;
        if (id==='fc-baixa') return <IconActivity color="#5ba3ff" size={18}/>;
        if (id==='pa-alta') return <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff5555" strokeWidth="2" strokeLinecap="round"><path d="M12 2v20M8 6l4-4 4 4M8 10h8M8 14h8"/></svg>;
        if (id==='pa-baixa') return <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5ba3ff" strokeWidth="2" strokeLinecap="round"><path d="M12 22V2M8 18l4 4 4-4M8 10h8M8 14h8"/></svg>;
        return null;
      };

      return (
        <div style={{ minHeight:'100vh', backgroundColor:'#0f0f0f', color:'white', padding:'16px 14px 80px', fontFamily:'system-ui, -apple-system, sans-serif', position:'relative', overflowX:'hidden', maxWidth:'500px', margin:'0 auto' }}>
          <header style={{ marginBottom:'16px' }}>
            <h1 style={{ fontSize:'24px', fontWeight:900, color:'#00ff6a', letterSpacing:'-1px', margin:0, textShadow:'0 0 10px rgba(0,255,106,0.3)' }}>GUARDIAVIA</h1>
            <p style={{ fontSize:'9px', color:'rgba(0,255,106,0.7)', letterSpacing:'3px', margin:'2px 0 0' }}>PROTEÇÃO EM TEMPO REAL</p>
          </header>

          {/* === TAB: MONITOR === */}
          {activeTab === 'monitor' && (<>
            <div style={{ backgroundColor:'#1e1e1e', border:'1px solid #374151', padding:'10px 12px', borderRadius:'12px', display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'12px' }}>
              <div style={{ display:'flex', alignItems:'center', gap:'10px' }}>
                <button style={{ display:'flex', alignItems:'center', gap:'6px', background:'none', border:'none', cursor:'default', color: gpsActive ? '#22c55e' : '#9ca3af' }}>
                  <IconSignal color={gpsActive ? '#22c55e' : '#9ca3af'} size={16} strength={gpsActive ? 4 : 1}/>
                  <span style={{ fontSize:'12px', fontWeight:600 }}>{gpsActive ? 'GPS' : 'GPS...'}</span>
                </button>
                <button onClick={() => { if(!bluetoothOn) connectBluetooth(); else setBluetoothOn(false); playClick(); }} style={{ display:'flex', alignItems:'center', gap:'5px', background:'none', border:'none', cursor:'pointer', color: bluetoothOn ? '#3b82f6' : '#9ca3af', textShadow: bluetoothOn ? '0 0 8px rgba(59,130,246,0.6), 0 2px 4px rgba(0,0,0,0.5)' : '0 2px 4px rgba(0,0,0,0.5)' }}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={bluetoothOn ? '#3b82f6' : '#9ca3af'} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ filter: bluetoothOn ? 'drop-shadow(0 0 4px rgba(59,130,246,0.6)) drop-shadow(0 2px 2px rgba(0,0,0,0.4))' : 'drop-shadow(0 2px 2px rgba(0,0,0,0.4))' }}><polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"/></svg>
                  <span style={{ fontSize:'11px', fontWeight:700, fontStyle:'italic', letterSpacing:'-0.5px', textShadow: bluetoothOn ? '0 0 8px rgba(59,130,246,0.5), 0 2px 3px rgba(0,0,0,0.6)' : '0 2px 3px rgba(0,0,0,0.6)' }}>{bluetoothOn ? 'BlueTouch' : 'BlueTouch'}</span>
                </button>
              </div>
              <div style={{ display:'flex', alignItems:'center', gap:'10px' }}>
                {bluetoothOn && <span style={{ color:'#3b82f6', fontSize:'10px', fontWeight:600 }}>⌚ Watch conectado</span>}
                <span style={{ color: speed > 70 ? '#ff5555' : '#00ff6a', fontSize:'11px', fontWeight:700 }}>{speed === null ? '-- km/h' : speed+' km/h'}</span>
                <span style={{ color: heartRate > FC_ALTA_THRESHOLD ? '#ff5555' : heartRate < FC_BAIXA_THRESHOLD ? '#5ba3ff' : '#ff6eb4', fontSize:'11px', fontWeight:700 }}>♥ {monitoring ? (heartRate === null ? '--' : heartRate) : ''}</span>
                {monitoring && <span style={{ color: (pressaoSis >= 140 || pressaoSis === null) ? '#ff5555' : pressaoSis <= 90 ? '#5ba3ff' : '#9ca3af', fontSize:'10px', fontWeight:600 }}>{pressaoSis === null ? '--/--' : pressaoSis+'/'+pressaoDia}</span>}
              </div>
            </div>

            <div style={{ borderRadius:'12px', overflow:'hidden', marginBottom:'12px', border:'1px solid #374151', position:'relative' }}>
              <iframe src={mapUrl} width="100%" height="150" style={{ border:0, display:'block', transition:'opacity 0.3s' }} allowFullScreen="" loading="lazy"></iframe>
              {/* Triângulo de navegação */}
              {gpsActive && <div style={{ position:'absolute', top:'50%', left:'50%', transform:`translate(-50%,-50%) rotate(${heading}deg)`, transition:'transform 0.8s ease-out', zIndex:10, width:'28px', height:'28px', display:'flex', alignItems:'center', justifyContent:'center', filter:'drop-shadow(0 0 8px rgba(66,133,244,0.6))' }}><svg width="28" height="28" viewBox="0 0 28 28"><polygon points="14,2 24,24 14,19 4,24" fill="rgba(66,133,244,0.95)" stroke="white" strokeWidth="2"/></svg><div style={{ position:'absolute', inset:'-10px', borderRadius:'50%', backgroundColor:'rgba(66,133,244,0.12)', animation:'pulse 2s infinite' }}/></div>}
              {gpsActive && <div style={{ position:'absolute', bottom:'6px', left:'6px', backgroundColor:'rgba(0,0,0,0.7)', borderRadius:'6px', padding:'3px 8px', fontSize:'9px', color:'#00ff6a' }}>📍 {userLat.toFixed(4)}, {userLng.toFixed(4)}</div>}
              {gpsError && <div style={{ position:'absolute', bottom:'6px', left:'6px', backgroundColor:'rgba(0,0,0,0.7)', borderRadius:'6px', padding:'3px 8px', fontSize:'9px', color:'#ff5555' }}>{gpsError}</div>}
            </div>

            <section>
              <h2 style={{ color:'rgba(0,255,106,0.8)', fontSize:'9px', fontWeight:700, marginBottom:'10px', letterSpacing:'2px', textTransform:'uppercase' }}>Proteções Ativas</h2>
              {protections.map(p => <ProtectionCard key={p.id} title={p.title} desc={p.desc} color={p.color} active={p.active} onToggle={() => toggle(p.id)} icon={getIcon(p.id)} />)}
            </section>

            <button onClick={() => { setSosAlert(true); setSosCountdown(15); playSOS(); }} style={{ width:'100%', marginTop:'10px', padding:'12px', borderRadius:'12px', border:'2px solid #ff3333', backgroundColor:'rgba(255,50,50,0.12)', color:'#ff4444', fontWeight:900, fontSize:'14px', cursor:'pointer', boxShadow:'0 0 20px rgba(255,50,50,0.4), 0 0 40px rgba(255,50,50,0.15)', textShadow:'0 0 8px rgba(255,68,68,0.4)' }}>
              SOS — ALERTA MANUAL
            </button>

            <button onClick={() => { if (!monitoring && !sensorsRef.current.accel) calibrateAllSensors(); if (!monitoring) startForegroundService(); else stopForegroundService(); setMonitoring(!monitoring); monitoring ? playToggleOff() : playToggleOn(); }} style={{ width:'100%', marginTop:'8px', padding:'12px', borderRadius:'12px', border: monitoring ? '2px solid #00ff6a' : '2px solid #ff3333', backgroundColor: monitoring ? 'rgba(0,255,106,0.1)' : 'rgba(255,50,50,0.1)', color: monitoring ? '#00ff6a' : '#ff4444', fontWeight:700, fontSize:'13px', cursor:'pointer', boxShadow: monitoring ? '0 0 18px rgba(0,255,106,0.4), 0 0 35px rgba(0,255,106,0.1)' : '0 0 18px rgba(255,50,50,0.4), 0 0 35px rgba(255,50,50,0.1)', display:'flex', alignItems:'center', justifyContent:'center', gap:'8px', transition:'all 0.3s', textShadow: monitoring ? '0 0 6px rgba(0,255,106,0.4)' : '0 0 6px rgba(255,68,68,0.4)' }}>
              <span style={{ fontSize:'14px' }}>⏻</span> {monitoring ? 'Monitoramento Ativo' : 'Ativar Monitoramento'}
            </button>

            {/* Status dos sensores */}
            {(calibrating || sensorLog.length > 0) && (
              <div style={{ marginTop:'10px', backgroundColor:'#111', border:'1px solid #2a2a2a', borderRadius:'10px', padding:'10px 12px' }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'6px' }}>
                  <span style={{ color:'#00ff6a', fontSize:'9px', fontWeight:700, letterSpacing:'1px' }}>SENSORES</span>
                  <div style={{ display:'flex', gap:'4px' }}>
                    {Object.entries(sensorStatus).map(([k,v]) => (
                      <span key={k} style={{ width:'8px', height:'8px', borderRadius:'50%', backgroundColor: v==='ok'?'#00ff6a':v==='sim'?'#ffaa00':v==='erro'?'#ff5555':'#374151' }} title={k+': '+v}/>
                    ))}
                  </div>
                </div>
                {sensorLog.slice(-4).map((msg, i) => (
                  <p key={i} style={{ color:'#9ca3af', fontSize:'9px', margin:'2px 0', lineHeight:'1.3' }}>{msg}</p>
                ))}
                {calibrating && <p style={{ color:'#ffaa00', fontSize:'9px', margin:'4px 0 0', animation:'pulse 1s infinite' }}>⏳ Calibrando...</p>}
              </div>
            )}
          </>)}

          {/* === TAB: FICHA MÉDICA === */}
          {activeTab === 'ficha' && (
            <section>
              <h2 style={{ color:'rgba(34,197,94,0.8)', fontSize:'10px', fontWeight:700, marginBottom:'16px', letterSpacing:'2px', textTransform:'uppercase' }}>Ficha Médica</h2>
              {[
                { key:'sangue', label:'Tipo Sanguíneo', placeholder:'Ex: O+, A-, B+...' },
                { key:'alergias', label:'Alergias', placeholder:'Ex: Penicilina, Dipirona...' },
                { key:'condicoes', label:'Condições Médicas', placeholder:'Ex: Diabetes, Asma...' },
                { key:'medicamentos', label:'Medicamentos em Uso', placeholder:'Ex: Losartana 50mg...' },
                { key:'plano', label:'Plano de Saúde', placeholder:'Ex: Unimed - 0012345678' },
              ].map((item) => (
                <div key={item.key} style={{ backgroundColor:'#1a1a1a', border:'1px solid #2a2a2a', borderRadius:'12px', padding:'14px 16px', marginBottom:'10px' }}>
                  <label style={{ color:'#9ca3af', fontSize:'11px', display:'block', marginBottom:'6px' }}>{item.label}</label>
                  <input
                    type="text"
                    placeholder={item.placeholder}
                    value={ficha[item.key]}
                    onChange={(e) => setFicha({...ficha, [item.key]: e.target.value})}
                    style={{ width:'100%', background:'none', border:'none', outline:'none', color:'white', fontSize:'14px', fontWeight:600 }}
                  />
                </div>
              ))}
              <button onClick={() => { try { localStorage.setItem('gv_ficha', JSON.stringify(ficha)); playToggleOn(); } catch(e){} }} style={{ width:'100%', padding:'14px', borderRadius:'12px', border:'2px solid #00ff6a', backgroundColor:'rgba(0,255,106,0.1)', color:'#00ff6a', fontWeight:900, fontSize:'14px', cursor:'pointer', marginTop:'10px', boxShadow:'0 0 15px rgba(0,255,106,0.3)', textShadow:'0 0 6px rgba(0,255,106,0.4)' }}>💾 Salvar Ficha Médica</button>
            </section>
          )}

          {/* === TAB: CONTATOS === */}
          {activeTab === 'contatos' && (
            <section>
              {/* === TELEGRAM BOT CONFIG === */}
              <div style={{ marginBottom:'20px', backgroundColor:'#111', border: telegramConfig.ativo ? '2px solid #2AABEE' : '1px solid #374151', borderRadius:'12px', padding:'14px', boxShadow: telegramConfig.ativo ? '0 0 20px rgba(42,171,238,0.2)' : 'none' }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'10px' }}>
                  <div style={{ display:'flex', alignItems:'center', gap:'8px' }}>
                    <span style={{ fontSize:'18px' }}>✈️</span>
                    <span style={{ color:'#2AABEE', fontSize:'12px', fontWeight:900, letterSpacing:'0.5px' }}>TELEGRAM BOT</span>
                  </div>
                  <button onClick={() => setTelegramConfig({...telegramConfig, ativo: !telegramConfig.ativo})} style={{ padding:'4px 10px', borderRadius:'6px', border: telegramConfig.ativo ? '1px solid #2AABEE' : '1px solid #374151', background: telegramConfig.ativo ? 'rgba(42,171,238,0.15)' : 'transparent', color: telegramConfig.ativo ? '#2AABEE' : '#6b7280', fontSize:'10px', fontWeight:700, cursor:'pointer' }}>
                    {telegramConfig.ativo ? '✅ ATIVO' : 'DESLIGADO'}
                  </button>
                </div>
                <input type="text" placeholder="Bot Token (ex: 123456:ABC-DEF...)" value={telegramConfig.botToken} onChange={(e) => setTelegramConfig({...telegramConfig, botToken: e.target.value})} style={{ width:'100%', background:'#0f0f0f', border:'1px solid #374151', borderRadius:'8px', padding:'8px 10px', color:'#2AABEE', fontSize:'11px', outline:'none', marginBottom:'6px' }} />
                <input type="text" placeholder="Chat ID (ex: 5067230242)" value={telegramConfig.chatId} onChange={(e) => setTelegramConfig({...telegramConfig, chatId: e.target.value})} style={{ width:'100%', background:'#0f0f0f', border:'1px solid #374151', borderRadius:'8px', padding:'8px 10px', color:'#2AABEE', fontSize:'11px', outline:'none', marginBottom:'8px' }} />
                <div style={{ display:'flex', gap:'6px' }}>
                  <button onClick={async () => {
                    const ok = await sendTelegram('✅ *Teste GuardiaVia*\n\nConexão Telegram funcionando!\n🕐 ' + new Date().toLocaleString('pt-BR'));
                    if (ok) alert('✅ Mensagem de teste enviada pro Telegram!');
                    else alert('❌ Falha no envio. Verifique Token e Chat ID.');
                  }} style={{ flex:1, padding:'8px', borderRadius:'8px', border:'1px solid rgba(42,171,238,0.4)', background:'rgba(42,171,238,0.08)', color:'#2AABEE', fontSize:'10px', fontWeight:700, cursor:'pointer' }}>
                    📨 Testar Envio
                  </button>
                  <button onClick={async () => {
                    const ok = await sendTelegram('🚨 *TESTE EMERGÊNCIA*\n\n⚠️ Tipo: FC ALTA\n📊 Detalhe: 165 bpm\n📍 Localização: https://www.google.com/maps?q='+userLat+','+userLng+'\n\n⏱️ Simulação de alerta');
                    if (ok) alert('🚨 Alerta de teste enviado!');
                    else alert('❌ Falha. Verifique configuração.');
                  }} style={{ flex:1, padding:'8px', borderRadius:'8px', border:'1px solid rgba(255,85,85,0.4)', background:'rgba(255,85,85,0.08)', color:'#ff5555', fontSize:'10px', fontWeight:700, cursor:'pointer' }}>
                    🚨 Testar Emergência
                  </button>
                </div>
                <p style={{ color:'#4b5563', fontSize:'8px', marginTop:'6px', lineHeight:'1.3' }}>1. Crie um bot: @BotFather → /newbot → copie o Token<br/>2. Envie /start pro seu bot → pegue seu Chat ID em @userinfobot</p>
              </div>

              <h2 style={{ color:'rgba(34,197,94,0.8)', fontSize:'10px', fontWeight:700, marginBottom:'16px', letterSpacing:'2px', textTransform:'uppercase' }}>Contatos de Emergência</h2>
              {contatos.map((c, i) => (
                <div key={i} style={{ backgroundColor:'#1a1a1a', border:'1px solid #2a2a2a', borderRadius:'12px', padding:'16px', marginBottom:'10px' }}>
                  <div style={{ display:'flex', gap:'8px', marginBottom:'8px' }}>
                    <input type="text" placeholder="Nome" value={c.nome} onChange={(e) => { const nc=[...contatos]; nc[i].nome=e.target.value; setContatos(nc); }} style={{ flex:2, background:'#0f0f0f', border:'1px solid #374151', borderRadius:'8px', padding:'8px 10px', color:'white', fontSize:'13px', outline:'none' }} />
                    <input type="text" placeholder="Relação" value={c.relacao} onChange={(e) => { const nc=[...contatos]; nc[i].relacao=e.target.value; setContatos(nc); }} style={{ flex:1, background:'#0f0f0f', border:'1px solid #374151', borderRadius:'8px', padding:'8px 10px', color:'white', fontSize:'13px', outline:'none' }} />
                  </div>
                  <div style={{ display:'flex', gap:'8px', alignItems:'center' }}>
                    <input type="tel" placeholder="(00) 00000-0000" value={c.tel} onChange={(e) => { const nc=[...contatos]; nc[i].tel=e.target.value; setContatos(nc); }} style={{ flex:1, background:'#0f0f0f', border:'1px solid #374151', borderRadius:'8px', padding:'8px 10px', color:'white', fontSize:'13px', outline:'none' }} />
                    <button onClick={() => setContatos(contatos.filter((_,idx)=>idx!==i))} style={{ background:'rgba(239,68,68,0.1)', border:'1px solid rgba(239,68,68,0.3)', borderRadius:'8px', padding:'8px 10px', color:'#ef4444', fontSize:'12px', cursor:'pointer', fontWeight:700 }}>✕</button>
                  </div>

                </div>
              ))}
              <button onClick={() => setContatos([...contatos, {nome:'', tel:'', relacao:'', apikey:''}])} style={{ width:'100%', padding:'14px', borderRadius:'12px', border:'1px dashed #374151', backgroundColor:'transparent', color:'#00ff6a', fontWeight:700, fontSize:'14px', cursor:'pointer', marginTop:'8px' }}>+ Adicionar Contato</button>
              <button onClick={() => { try { localStorage.setItem('gv_contatos', JSON.stringify(contatos)); playToggleOn(); } catch(e){} }} style={{ width:'100%', padding:'14px', borderRadius:'12px', border:'2px solid #00ff6a', backgroundColor:'rgba(0,255,106,0.1)', color:'#00ff6a', fontWeight:900, fontSize:'14px', cursor:'pointer', marginTop:'10px', boxShadow:'0 0 15px rgba(0,255,106,0.3)', textShadow:'0 0 6px rgba(0,255,106,0.4)' }}>💾 Salvar Contatos</button>
            </section>
          )}

          {/* === TAB: HISTÓRICO === */}
          {activeTab === 'historico' && (
            <section>
              <h2 style={{ color:'rgba(0,255,106,0.8)', fontSize:'9px', fontWeight:700, marginBottom:'12px', letterSpacing:'2px', textTransform:'uppercase' }}>Histórico de Alertas</h2>
              
              {/* Sub-abas */}
              <div style={{ display:'flex', gap:'6px', marginBottom:'14px' }}>
                {[
                  { id:'fc', label:'♥ Freq. Cardíaca', cor:'#ff6eb4' },
                  { id:'pressao', label:'⬆ Pressão', cor:'#5ba3ff' },
                  { id:'colisao', label:'💥 Colisão', cor:'#ff5555' },
                ].map(t => (
                  <button key={t.id} onClick={() => setHistTab(t.id)} style={{ flex:1, padding:'8px 4px', borderRadius:'8px', border: histTab===t.id ? '1px solid '+t.cor : '1px solid #333', backgroundColor: histTab===t.id ? t.cor+'15' : 'transparent', color: histTab===t.id ? t.cor : '#6b7280', fontSize:'9px', fontWeight:700, cursor:'pointer', transition:'all 0.2s' }}>{t.label}</button>
                ))}
              </div>

              {/* Histórico FC */}
              {histTab === 'fc' && (<>
                <p style={{ color:'#6b7280', fontSize:'10px', marginBottom:'10px', lineHeight:'1.4' }}>⚠️ Alerta: FC ≥ {FC_CRITICA_ALTA} bpm (taquicardia grave) ou ≤ {FC_CRITICA_BAIXA} bpm (bradicardia grave) dispara emergência.</p>
                {historicoFC.length === 0 && <p style={{ color:'#4b5563', fontSize:'11px', textAlign:'center', padding:'20px 0' }}>Nenhum alerta de FC registrado ainda.</p>}
                {historicoFC.map((h, i) => (
                  <div key={i} style={{ backgroundColor:'#1a1a1a', border:'1px solid #2a2a2a', borderRadius:'10px', padding:'12px 14px', marginBottom:'8px', borderLeft:'3px solid '+h.cor }}>
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                      <span style={{ color: h.cor, fontSize:'12px', fontWeight:700 }}>{h.tipo}</span>
                      <span style={{ color:'#4b5563', fontSize:'9px' }}>{h.data}</span>
                    </div>
                    <p style={{ color:'#9ca3af', fontSize:'11px', margin:'4px 0 0' }}>{h.valor}</p>
                  </div>
                ))}
              </>)}

              {/* Histórico Pressão */}
              {histTab === 'pressao' && (<>
                <p style={{ color:'#6b7280', fontSize:'10px', marginBottom:'10px', lineHeight:'1.4' }}>⚠️ Emergência: PA ≥ {PA_EMERGENCIA_SIS}/{PA_EMERGENCIA_DIA} mmHg (crise hipertensiva) ou ≤ {PA_HIPO_SIS}/{PA_HIPO_DIA} mmHg (hipotensão grave/choque).</p>

                <p style={{ color:'#9ca3af', fontSize:'12px', margin:'0 0 16px' }}>Frequência cardíaca: <strong style={{color:'#ff6eb4'}}>{heartRate} bpm</strong></p>
                <div style={{ width:'70px', height:'70px', borderRadius:'50%', border:'4px solid #ff6eb4', display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 16px', boxShadow:'0 0 20px rgba(255,110,180,0.4)' }}>
                  <span style={{ fontSize:'28px', fontWeight:900, color:'#ff6eb4' }}>{fcCountdown}</span>
                </div>
                <p style={{ color:'#ffaacc', fontSize:'11px', margin:'0 0 20px', lineHeight:'1.4' }}>Alerta será enviado aos contatos em {fcCountdown}s.<br/>Toque abaixo se você está bem.</p>
                <button onClick={() => { setFcAlert(false); setFcCountdown(15); }} style={{ width:'100%', padding:'14px', borderRadius:'12px', border:'2px solid #00ff6a', backgroundColor:'rgba(0,255,106,0.1)', color:'#00ff6a', fontWeight:900, fontSize:'14px', cursor:'pointer', boxShadow:'0 0 15px rgba(0,255,106,0.3)' }}>✓ ESTOU BEM</button>
              </div>
            </div>
          )}

          {/* Modal Alerta Pressão */}
          {paAlert && (
            <div style={{ position:'fixed', inset:0, display:'flex', alignItems:'center', justifyContent:'center', backgroundColor:'rgba(0,0,0,0.9)', zIndex:2000, padding:'24px' }}>
              <div style={{ backgroundColor:'#1a1a1a', borderRadius:'20px', padding:'28px', maxWidth:'340px', width:'100%', textAlign:'center', border:'2px solid rgba(91,163,255,0.6)', boxShadow:'0 0 40px rgba(91,163,255,0.4)', animation:'pulse 1s infinite' }}>
                <div style={{ fontSize:'48px', marginBottom:'12px' }}>🩺</div>
                <h2 style={{ color: paAlertType.includes('HIPER') ? '#ff5555' : '#5ba3ff', fontSize:'16px', fontWeight:900, margin:'0 0 6px', textShadow:'0 0 10px rgba(91,163,255,0.5)' }}>{paAlertType}</h2>
                <p style={{ color:'#9ca3af', fontSize:'12px', margin:'0 0 16px' }}>Pressão arterial: <strong style={{color: paAlertType.includes('HIPER') ? '#ff5555' : '#5ba3ff'}}>{pressaoSis}/{pressaoDia} mmHg</strong></p>
                <div style={{ width:'70px', height:'70px', borderRadius:'50%', border:'4px solid '+(paAlertType.includes('HIPER')?'#ff5555':'#5ba3ff'), display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 16px', boxShadow:'0 0 20px '+(paAlertType.includes('HIPER')?'rgba(255,85,85,0.4)':'rgba(91,163,255,0.4)') }}>
                  <span style={{ fontSize:'28px', fontWeight:900, color: paAlertType.includes('HIPER')?'#ff5555':'#5ba3ff' }}>{paCountdown}</span>
                </div>
                <p style={{ color:'#aaccff', fontSize:'11px', margin:'0 0 20px', lineHeight:'1.4' }}>Alerta será enviado aos contatos em {paCountdown}s.<br/>Toque abaixo se você está bem.</p>
                <button onClick={() => { setPaAlert(false); setPaCountdown(15); }} style={{ width:'100%', padding:'14px', borderRadius:'12px', border:'2px solid #00ff6a', backgroundColor:'rgba(0,255,106,0.1)', color:'#00ff6a', fontWeight:900, fontSize:'14px', cursor:'pointer', boxShadow:'0 0 15px rgba(0,255,106,0.3)' }}>✓ ESTOU BEM</button>
              </div>
            </div>
          )}

          <p style={{ textAlign:'center', color:'#2a2a2a', fontSize:'8px', padding:'8px 0 80px', letterSpacing:'1px' }}>© 2026 Paulo Sergio Bresciani Junior — GuardiaVia v2.0</p>
          <nav style={{ position:'fixed', bottom:0, left:0, right:0, backgroundColor:'#1a1a1a', borderTop:'1px solid #2a2a2a', display:'flex', justifyContent:'space-around', padding:'10px 0 16px', zIndex:100 }}>
            {[
              { id:'monitor', label:'Monitor', desc:'Tempo real', icon: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={activeTab==='monitor'?'#00ff6a':'#6b7280'} strokeWidth="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg> },
              { id:'ficha', label:'Ficha Médica', desc:'Dados de saúde', icon: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={activeTab==='ficha'?'#00ff6a':'#6b7280'} strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg> },
              { id:'contatos', label:'Contatos', desc:'Emergência', icon: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={activeTab==='contatos'?'#00ff6a':'#6b7280'} strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> },
              { id:'historico', label:'Histórico', desc:'Alertas passados', icon: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={activeTab==='historico'?'#00ff6a':'#6b7280'} strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> },
              { id:'config', label:'Config', desc:'Ajustes', icon: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={activeTab==='config'?'#00e5ff':'#6b7280'} strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> },
            ].map((tab) => (
              <button key={tab.id} onClick={() => { setActiveTab(tab.id); playClick(); }} style={{ background:'none', border:'none', cursor:'pointer', display:'flex', flexDirection:'column', alignItems:'center', gap:'2px' }}>
                {tab.icon}
                <span style={{ fontSize:'10px', color: activeTab===tab.id ? '#00ff6a' : '#9ca3af', fontWeight:700 }}>{tab.label}</span>
                <span style={{ fontSize:'8px', color: activeTab===tab.id ? 'rgba(0,255,106,0.6)' : '#4b5563' }}>{tab.desc}</span>
              </button>
            ))}
          </nav>
        </div>
      );
    }

    // App Root com Security Gate
    function SecureApp() {
      const [authState, setAuthState] = useState('loading'); // loading, setup, locked, unlocked
      const inactivityTimer = useRef(null);

      useEffect(() => {
        if (!checkIntegrity()) {
          // Integridade comprometida — forçar novo setup
          localStorage.removeItem(SECURITY_CONFIG.SETUP_KEY);
        }
        if (!isSetupDone()) { setAuthState('setup'); return; }
        if (!hasPIN()) { setAuthState('unlocked'); return; }
        setAuthState('locked');
      }, []);

      // Bloqueio por inatividade (5 min)
      useEffect(() => {
        if (authState !== 'unlocked') return;
        const resetTimer = () => {
          if (inactivityTimer.current) clearTimeout(inactivityTimer.current);
          localStorage.setItem(SECURITY_CONFIG.LAST_ACTIVITY_KEY, String(Date.now()));
          inactivityTimer.current = setTimeout(() => {
            setAuthState('locked');
          }, SECURITY_CONFIG.LOCK_TIMEOUT);
        };
        // Eventos de atividade
        const events = ['touchstart', 'click', 'scroll', 'keydown'];
        events.forEach(e => document.addEventListener(e, resetTimer, { passive: true }));
        resetTimer();
        // Bloquear ao sair do app (visibilitychange)
        const handleVisibility = () => {
          if (document.visibilityState === 'hidden') {
            localStorage.setItem(SECURITY_CONFIG.LAST_ACTIVITY_KEY, String(Date.now()));
          }
          if (document.visibilityState === 'visible') {
            const last = parseInt(localStorage.getItem(SECURITY_CONFIG.LAST_ACTIVITY_KEY) || '0');
            if (Date.now() - last > SECURITY_CONFIG.LOCK_TIMEOUT) {
              setAuthState('locked');
            }
          }
        };
        document.addEventListener('visibilitychange', handleVisibility);
        return () => {
          events.forEach(e => document.removeEventListener(e, resetTimer));
          document.removeEventListener('visibilitychange', handleVisibility);
          if (inactivityTimer.current) clearTimeout(inactivityTimer.current);
        };
      }, [authState]);

      if (authState === 'loading') return <div style={{ minHeight:'100vh', background:'#0f0f0f', display:'flex', alignItems:'center', justifyContent:'center' }}><div style={{ color:'#00ff6a', fontSize:'14px' }}>Carregando...</div></div>;
      if (authState === 'setup') return <SecuritySetup onComplete={() => setAuthState('unlocked')} />;
      if (authState === 'locked') return <LockScreen onUnlock={() => setAuthState('unlocked')} />;
      return <App />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SecureApp />);
  </script>
