name: Build GuardiaVia APK

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Cordova CLI
      run: npm install -g cordova

    - name: Install Dependencies
      run: npm install

    - name: Organize WWW Folder and Fix config.xml
      run: |
        mkdir -p www
        cp index.html www/ 2>/dev/null || true
        cp icon.svg www/ 2>/dev/null || true
        cp ícone.svg www/ 2>/dev/null || true
        cp manifest.json www/ 2>/dev/null || true
        cp sw.js www/ 2>/dev/null || true
        
        # Remove referências de ícones que não existem para não quebrar o build
        sed -i '/<icon/d' config.xml
        sed -i '/res\/icon/d' config.xml
        
        # Corrige o erro de "AttributePrefixUnbound" injetando o namespace do Android no config.xml
        sed -i 's/<widget/<widget xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android"/g' config.xml

    - name: Add Android Platform
      run: cordova platform add android@13.0.0

    - name: Build APK (Debug)
      run: cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GuardiaVia-APK-Debug
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
