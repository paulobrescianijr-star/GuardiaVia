name: Build GuardiaVia APK

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Cordova CLI
      run: npm install -g cordova

    - name: Install Dependencies
      run: npm install

    - name: Organize WWW Folder and Fix config.xml
      run: |
        mkdir -p www
        
        # Copia os ficheiros essenciais, ignorando pastas pesadas do sistema
        for item in *; do
          if [ "$item" != "www" ] && [ "$item" != "platforms" ] && [ "$item" != "plugins" ] && [ "$item" != "config.xml" ] && [ "$item" != "BUILD-APK.bat" ] && [ "$item" != "node_modules" ] && [ "$item" != "app-icon.png" ]; then
            cp -r "$item" www/ 2>/dev/null || true
          fi
        done
        
        # CORREÇÃO CRÍTICA DO ECRÃ PRETO: Transforma caminhos absolutos do React em relativos
        sed -i 's/src="\//src=".\//g' www/index.html
        sed -i 's/href="\//href=".\//g' www/index.html
        
        # Remove referências de ícones antigos que quebram o build
        sed -i '/<icon/d' config.xml
        sed -i '/res\/icon/d' config.xml
        
        # Corrige o namespace do Android
        sed -i 's/<widget/<widget xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android"/g' config.xml
        
        # Se tiver enviado o ficheiro app-icon.png, ativa o ícone automaticamente
        if [ -f "app-icon.png" ]; then
          cp app-icon.png www/ 2>/dev/null || true
          sed -i '/<widget /a \    <icon src="www/app-icon.png" />' config.xml
        fi
        
        # Liberta o acesso à rede mantendo o padrão file:// exigido pelo Verdent para tirar o ecrã preto
        sed -i 's|<\/widget>|    <access origin="*" />\n    <allow-navigation href="*" />\n    <allow-intent href="*" />\n    <preference name="CleartextTraffic" value="true" />\n<\/widget>|g' config.xml

    - name: Add Android Platform
      run: cordova platform add android@13.0.0

    - name: Build APK (Debug)
      run: cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GuardiaVia-APK-Debug
        path: platforms/android/app/build/outputs/apk/**/*.apk
