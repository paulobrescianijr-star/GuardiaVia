name: Build GuardiaVia APK

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout do Codigo
      uses: actions/checkout@v4

    - name: Instalar Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Instalar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Android SDK
      uses: android-actions/setup-android@v3

    - name: Instalar Cordova CLI
      run: npm install -g cordova

    - name: Instalar Dependencias
      run: npm install

    - name: Adicionar Plataforma Android
      run: cordova platform add android@13.0.0

    - name: Construir APK (Debug)
      run: cordova build android --debug

    - name: Disponibilizar APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: GuardiaVia-APK-Debug
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
